[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-softfail"
version = "0.1.0"
description = "Optical soft-failure detection: predict EDFA/transceiver aging before LOS and re-route"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "optics-softfail contributors" }]
keywords = ["optical", "dwdm", "anomaly-detection", "soft-failure", "telemetry"]

dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "pydantic==2.7.1",
  "PyYAML==6.0.1",
  "scikit-learn==1.5.0",
  "joblib==1.4.2",
  "torch==2.2.2",
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "httpx==0.27.0",
  "grpcio==1.64.1",
  "grpcio-tools==1.64.1",
  "protobuf==5.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.1",
  "pytest-asyncio==0.23.7",
]

[tool.setuptools]
packages = ["apps", "ml", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
